services:
  bookrr:
    # Immagine multi-arch (amd64, 386, arm64, armv7, armv6) pubblicata dalla CI.
    # Per compilarla in locale: docker compose up -d --build
    image: ghcr.io/tehmaat/bookrr:latest
    build: .
    container_name: bookrr
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: Europe/Rome
      # Ogni quanto leggere i client qBittorrent (min 30s)
      BOOKRR_SYNC_INTERVAL: 5m
      # Ogni quanto leggere i bucket S3 degli archivi cloud (min 1m)
      # BOOKRR_S3_SCAN_INTERVAL: 1h
      # Tag che identifica le tue release
      BOOKRR_RELEASE_TAG: Personal Release
      # Token richiesto dal webhook (consigliato se bookrr è esposto)
      # BOOKRR_WEBHOOK_TOKEN: cambiami
      # Login opzionale per l'interfaccia web
      # BOOKRR_AUTH_USER: admin
      # BOOKRR_AUTH_PASSWORD: cambiami
      # Tracker UNIT3D dove cercare l'hash dei torrent aggiunti senza
      # BOOKRR_UNIT3D_URL: https://tracker.example
      # BOOKRR_UNIT3D_API_KEY: la-tua-api-key
